<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تتبع طلبك | منصة أثر</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0f766e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="/" class="logo"><span class="logo__mark">أ</span><span class="logo__text">منصة <strong>أثر</strong></span></a>
      <a href="/#donate" class="btn btn--primary btn--sm">تبرع الآن</a>
    </div>
  </header>

  <main class="track-page">
    <div class="container narrow">
      <h1 class="section__title center">تتبع حالة تبرعك</h1>
      <p class="section__sub center">اكتب رقم الطلب وآخر 4 أرقام من جوالك</p>

      <form class="form" id="track-form">
        <div class="form__row">
          <label>رقم الطلب<input type="text" name="code" required placeholder="ATR-XXXXXX" dir="ltr" autocomplete="off"></label>
          <label>آخر 4 أرقام من الجوال<input type="text" name="phoneLast4" required inputmode="numeric" maxlength="4" pattern="\d{4}" dir="ltr"></label>
        </div>
        <p class="form__error" id="track-error" role="alert"></p>
        <button class="btn btn--primary btn--block" type="submit">عرض الحالة</button>
      </form>

      <section class="form" id="track-result" hidden style="margin-top:24px">
        <h2 id="r-title"></h2>
        <p id="r-meta" class="lead" style="margin:0"></p>
        <ol class="timeline" id="r-timeline"></ol>
      </section>
    </div>
  </main>

  <script>
  (function () {
    const form = document.getElementById('track-form');
    const err = document.getElementById('track-error');
    const result = document.getElementById('track-result');
    const fmt = (iso) => new Date(iso).toLocaleString('ar-SA-u-ca-gregory', { dateStyle: 'medium', timeStyle: 'short' });
    const params = new URLSearchParams(location.search);
    if (params.get('code')) form.code.value = params.get('code');

    let statuses = [];
    fetch('/api/statuses').then((r) => r.json()).then((s) => { statuses = s; }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      result.hidden = true;
      try {
        const res = await fetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: form.code.value.trim(), phoneLast4: form.phoneLast4.value.trim() })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        render(d);
      } catch (ex) {
        err.textContent = ex.message || 'تعذّر جلب الحالة';
      }
    });

    function render(d) {
      document.getElementById('r-title').textContent = `الحالة: ${d.statusLabel}`;
      document.getElementById('r-meta').textContent =
        `${d.code} · ${d.types.join('، ')} · ${d.city}` + (d.pickupDate ? ` · موعد الاستلام: ${d.pickupDate}` : '');
      const tl = document.getElementById('r-timeline');
      tl.innerHTML = '';
      const reached = Object.fromEntries(d.history.map((h) => [h.status, h.at]));
      const steps = d.status === 'cancelled'
        ? d.history.map((h) => ({ key: h.status, label: h.label }))
        : (statuses.statuses || d.history.map((h) => ({ key: h.status, label: h.label })));
      steps.forEach((s) => {
        const li = document.createElement('li');
        li.textContent = s.label;
        if (reached[s.key]) {
          li.classList.add('done');
          const small = document.createElement('small');
          small.textContent = fmt(reached[s.key]);
          li.appendChild(small);
        }
        if (s.key === d.status) li.classList.add('current');
        tl.appendChild(li);
      });
      result.hidden = false;
    }
  })();
  </script>
</body>
</html>
